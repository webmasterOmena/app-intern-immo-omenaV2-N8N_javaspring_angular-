name: omena-immo-v2\n\nx-logging: &default-logging\n  driver: json-file\n  options:\n    max-size: "10m"\n    max-file: "3"\n\nservices:\n  immo-db:\n    image: postgres:17-alpine\n    container_name: omena-immo-db\n    restart: unless-stopped\n    environment:\n      POSTGRES_DB: "${IMMO_DB_NAME:-immo}"\n      POSTGRES_USER: "${IMMO_DB_USER:-immo}"\n      POSTGRES_PASSWORD: "${IMMO_DB_PASSWORD:-immo-local-change-me}"\n      TZ: "${TZ:-Europe/Paris}"\n    volumes:\n      - immo_db_data:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]\n      interval: 5s\n      timeout: 5s\n      retries: 20\n    logging: *default-logging\n\n  immo-api:\n    build:\n      context: ./immo-api\n    container_name: omena-immo-api\n    restart: unless-stopped\n    environment:\n      TZ: "${TZ:-Europe/Paris}"\n      DB_HOST: immo-db\n      DB_PORT: "5432"\n      DB_NAME: "${IMMO_DB_NAME:-immo}"\n      DB_USER: "${IMMO_DB_USER:-immo}"\n      DB_PASSWORD: "${IMMO_DB_PASSWORD:-immo-local-change-me}"\n      APP_CORS_ALLOWED_ORIGINS: "http://localhost:${WEB_PORT:-4200}"\n    ports:\n      - "${API_PORT:-8080}:8080"\n    depends_on:\n      immo-db:\n        condition: service_healthy\n    healthcheck:\n      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]\n      interval: 10s\n      timeout: 5s\n      retries: 20\n      start_period: 20s\n    logging: *default-logging\n\n  immo-web:\n    build:\n      context: ./immo-web\n    container_name: omena-immo-web\n    restart: unless-stopped\n    ports:\n      - "${WEB_PORT:-4200}:80"\n    depends_on:\n      immo-api:\n        condition: service_healthy\n    healthcheck:\n      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null 2>&1 || exit 1"]\n      interval: 10s\n      timeout: 5s\n      retries: 10\n    logging: *default-logging\n\n  n8n-db:\n    image: postgres:17-alpine\n    container_name: omena-n8n-db\n    restart: unless-stopped\n    environment:\n      POSTGRES_DB: "${N8N_DB_NAME:-n8n}"\n      POSTGRES_USER: "${N8N_DB_USER:-n8n}"\n      POSTGRES_PASSWORD: "${N8N_DB_PASSWORD:-n8n-local-change-me}"\n      TZ: "${TZ:-Europe/Paris}"\n    volumes:\n      - n8n_db_data:/var/lib/postgresql/data\n    healthcheck:\n      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]\n      interval: 5s\n      timeout: 5s\n      retries: 20\n    logging: *default-logging\n\n  n8n:\n    image: "docker.n8n.io/n8nio/n8n:${N8N_VERSION:-stable}"\n    container_name: omena-n8n\n    restart: unless-stopped\n    environment:\n      TZ: "${TZ:-Europe/Paris}"\n      GENERIC_TIMEZONE: "${TZ:-Europe/Paris}"\n      N8N_HOST: localhost\n      N8N_LISTEN_ADDRESS: "0.0.0.0"\n      N8N_PORT: "5678"\n      N8N_PROTOCOL: http\n      N8N_EDITOR_BASE_URL: "http://localhost:${N8N_PUBLIC_PORT:-5679}"\n      N8N_WEBHOOK_URL: "http://localhost:${N8N_PUBLIC_PORT:-5679}/"\n      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:-local-development-key-change-before-production}"\n      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"\n      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"\n      DB_TYPE: postgresdb\n      DB_POSTGRESDB_HOST: n8n-db\n      DB_POSTGRESDB_PORT: "5432"\n      DB_POSTGRESDB_DATABASE: "${N8N_DB_NAME:-n8n}"\n      DB_POSTGRESDB_USER: "${N8N_DB_USER:-n8n}"\n      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD:-n8n-local-change-me}"\n      IMMO_API_BASE_URL: "http://immo-api:8080"\n      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"\n    ports:\n      - "${N8N_PUBLIC_PORT:-5679}:5678"\n    volumes:\n      - n8n_data:/home/node/.n8n\n      - ./n8n/workflows:/workflows\n    extra_hosts:\n      - "host.docker.internal:host-gateway"\n    depends_on:\n      n8n-db:\n        condition: service_healthy\n      immo-api:\n        condition: service_healthy\n    healthcheck:\n      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]\n      interval: 10s\n      timeout: 5s\n      retries: 30\n      start_period: 20s\n    logging: *default-logging\n\nvolumes:\n  immo_db_data:\n  n8n_db_data:\n  n8n_data:\n