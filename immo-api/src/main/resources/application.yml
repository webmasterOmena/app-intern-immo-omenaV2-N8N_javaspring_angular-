server:
  port: 8080

spring:
  application:
    name: immo-api
  datasource:
    url: "jdbc:postgresql://${DB_HOST:immo-db}:${DB_PORT:5432}/${DB_NAME:immo}"
    username: "${DB_USER:immo}"
    password: "${DB_PASSWORD:immo-local-change-me}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}"
