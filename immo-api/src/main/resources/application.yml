server:
  port: 8080

spring:
  application:
    name: immo-api
  datasource:
    url: "jdbc:postgresql://${DB_HOST:immo-db}:${DB_PORT:5432}/${DB_NAME:immo}"
    username: "${DB_USER:immo}"
    password: "${DB_PASSWORD:immo-local-change-me}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: "${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}"

  integrations:
    n8n-url: "${N8N_INTERNAL_URL:http://n8n:5678}"
    n8n-db:
      host: "${N8N_DB_HOST:n8n-db}"
      port: ${N8N_DB_PORT:5432}
      name: "${N8N_DB_NAME:n8n}"
      user: "${N8N_DB_USER:n8n}"
      password: "${N8N_DB_PASSWORD:n8n-local-change-me}"
